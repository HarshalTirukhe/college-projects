<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Student Marks</title>
</head>

<body>

    <h1>Student Marks Management</h1>

    <!-- Student Input -->

    <input type="text" id="name" placeholder="Student Name">

    <textarea id="physics" rows="3" cols="12"
        placeholder="Physics"></textarea>

    <textarea id="chemistry" rows="3" cols="12"
        placeholder="Chemistry"></textarea>

    <textarea id="maths" rows="3" cols="12"
        placeholder="Maths"></textarea>

    <button onclick="addStudent()">Add Student</button>


    <h2 id="topper"></h2>


    <!-- Student Table -->

    <table border="1">

        <thead>

            <tr>
                <th>Name</th>
                <th>Physics</th>
                <th>Chemistry</th>
                <th>Maths</th>
                <th>Total Marks</th>
                <th>Percentage</th>
            </tr>

        </thead>

        <tbody id="studentTable">

        </tbody>

    </table>


    <script src="script.js"></script>

</body>

</html>
